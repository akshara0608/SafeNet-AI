<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SafenetAI — Security Report</title>
<style>
:root{--text:#0f1f14;--muted:#5b6b60;--line:#d9e4dc;--red:#c62f3b;--amber:#a86b00;--green:#1c7c45}
*{box-sizing:border-box}body{margin:0;background:#f4f7f5;color:var(--text);font:13px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.page{max-width:960px;margin:24px auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:36px 40px}
.toolbar{max-width:960px;margin:20px auto 0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 4px}
.toolbar a{color:var(--muted);text-decoration:none;font-size:12px}
.toolbar button{border:1px solid #1c7c45;background:#1c7c45;color:#fff;border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:2px solid var(--text);padding-bottom:16px}
h1{margin:0;font-size:24px;letter-spacing:-.03em}h1 span{color:var(--green)}
header p{margin:4px 0 0;color:var(--muted);font-size:12px}
.meta{text-align:right;font-size:11px;color:var(--muted)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.1em;margin:28px 0 10px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{border:1px solid var(--line);border-radius:8px;padding:12px}.stat b{display:block;font-size:22px;letter-spacing:-.03em}.stat span{font-size:11px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{text-align:left;border-bottom:1px solid var(--text);padding:6px 8px;font-size:10px;text-transform:uppercase;letter-spacing:.06em}
td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
td.url{word-break:break-all;max-width:380px}
.lvl{font-weight:700}.lvl.Critical,.lvl.High{color:var(--red)}.lvl.Medium{color:var(--amber)}.lvl.Low{color:var(--green)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.empty{color:var(--muted);font-style:italic}
footer{margin-top:28px;padding-top:12px;border-top:1px solid var(--line);font-size:10px;color:var(--muted)}
@media(max-width:700px){.page{margin:12px;padding:20px 16px}.stats{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}header{display:block}.meta{text-align:left;margin-top:8px}}
@media print{body{background:#fff}.toolbar{display:none}.page{margin:0;border:0;padding:0;max-width:none}tr{break-inside:avoid}}
</style>
</head>
<body>
<div class="toolbar"><a href="/">← Back to dashboard</a><button onclick="window.print()">Print / Save as PDF</button></div>
<div class="page" id="report"><p class="empty">Loading report…</p></div>
<script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=iso=>new Date(iso).toLocaleString(undefined,{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
const days=new URLSearchParams(location.search).get('days')||'all';
const periodLabel=days==='all'?'All time':days==='1'?'Last 24 hours':`Last ${days} days`;
fetch('/api/reports?days='+encodeURIComponent(days)).then(r=>r.json().then(d=>{if(!r.ok||d.error)throw new Error(d.error||r.status);return d})).then(r=>{
 const s=r.summary;
 const rows=(list,cols,empty)=>list.length?list.join(''):`<tr><td colspan="${cols}" class="empty">${empty}</td></tr>`;
 document.getElementById('report').innerHTML=`
 <header><div><h1>safenet<span>ai</span> security report</h1><p>URL phishing analysis · ${esc(periodLabel)}</p></div>
 <div class="meta">Generated ${esc(fmt(r.generated_at))}<br>${s.total_scans} scan${s.total_scans===1?'':'s'} in period</div></header>
 <h2>Summary</h2>
 <div class="stats">
  <div class="stat"><b>${s.total_scans}</b><span>URLs scanned</span></div>
  <div class="stat"><b>${s.high_risk_scans}</b><span>High / critical risk</span></div>
  <div class="stat"><b>${s.phishing_scans}</b><span>Classified phishing</span></div>
  <div class="stat"><b>${s.avg_risk_score}</b><span>Average risk score</span></div>
 </div>
 <div class="two">
  <div><h2>Risk distribution</h2><table><thead><tr><th>Level</th><th>Scans</th><th>Share</th></tr></thead><tbody>
   ${['Critical','High','Medium','Low'].map(l=>`<tr><td class="lvl ${l}">${l}</td><td>${s.levels[l]||0}</td><td>${s.total_scans?Math.round((s.levels[l]||0)/s.total_scans*100):0}%</td></tr>`).join('')}
  </tbody></table></div>
  <div><h2>Detection signals</h2><table><thead><tr><th>Signal</th><th>Scans</th><th>High-risk</th></tr></thead><tbody>
   ${rows(s.signals.map(x=>`<tr><td>${esc(x.label)}</td><td>${x.count}</td><td>${x.high_risk_count}</td></tr>`),3,'No signals detected')}
  </tbody></table></div>
 </div>
 <h2>Most flagged domains</h2>
 <table><thead><tr><th>Domain</th><th>High-risk scans</th><th>Max score</th></tr></thead><tbody>
  ${rows(s.top_domains.map(d=>`<tr><td>${esc(d.host)}</td><td>${d.count}</td><td>${Math.round(d.max_risk_score)}</td></tr>`),3,'No high-risk domains in this period')}
 </tbody></table>
 <h2>All scans</h2>
 <table><thead><tr><th>Scanned</th><th>URL</th><th>Model</th><th>Phishing %</th><th>Score</th><th>Level</th></tr></thead><tbody>
  ${rows(r.scans.map(x=>`<tr><td>${esc(fmt(x.scanned_at))}</td><td class="url">${esc(x.url)}</td><td>${esc(x.classification)}</td><td>${x.phishing_probability}</td><td>${Math.round(x.risk_score)}</td><td class="lvl ${esc(x.risk_level)}">${esc(x.risk_level)}</td></tr>`),6,'No scans in this period')}
 </tbody></table>
 <footer>Risk scores combine the SafeNet Random Forest phishing probability with an HTTPS adjustment. Verdicts are automated estimates; verify suspicious sites through official channels.</footer>`;
}).catch(e=>{document.getElementById('report').innerHTML=`<p class="empty">Could not load report (${esc(e.message)}). Is the SafeNet backend running?</p>`});
</script>
</body>
</html>
